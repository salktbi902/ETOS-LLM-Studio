<title>وصفات xBloom السريعة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of controls on top, the recipe card below it, saved recipes as a short list at the end. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --fg:#1C2320; --muted:#5D6B66; --line:#D5DEDA;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --hot:#B4542A; --ice:#2F6E9E; --chip:#E4ECE9;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --fg:#E4EBE8; --muted:#97A6A0; --line:#2A3531;
  --accent:#4CBFA8; --accent-ink:#0C1412; --hot:#E58A5E; --ice:#7DB5E0; --chip:#222C29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --fg:#E4EBE8; --muted:#97A6A0; --line:#2A3531;
  --accent:#4CBFA8; --accent-ink:#0C1412; --hot:#E58A5E; --ice:#7DB5E0; --chip:#222C29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:700 1.7rem/1.2 var(--display);margin:0;text-wrap:balance}
h2{font:600 1.05rem/1.3 var(--display);margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:7px 14px;border-radius:999px;background:var(--chip);cursor:pointer;font-weight:500;border:1px solid transparent}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
.val{font-family:var(--mono);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;font-weight:600;color:var(--accent-ink)}
.tag.hot{background:var(--hot)} .tag.iced{background:var(--ice)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font:500 1.05rem var(--mono);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.stat span{font-size:.75rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:440px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:500}
td.n{font-family:var(--mono)}
.notes{margin:0;padding-inline-start:18px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 .9rem var(--body);padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{font-size:.85rem;color:var(--accent);min-height:1.2em}
.saved{display:flex;flex-direction:column;gap:8px}
.saved a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.saved a:hover,.saved a:focus-visible{border-color:var(--accent)}
.saved small{color:var(--muted)}
#copybox{width:100%;min-height:80px;font:13px var(--mono);direction:ltr;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (prefers-reduced-motion:no-preference){.seg label,button{transition:background .15s,border-color .15s}}
</style>

<div class="wrap" dir="rtl">
  <header>
    <h1>وصفات xBloom السريعة</h1>
    <p class="sub">اختر نوع البن، وتطلع لك وصفة جاهزة لـ xBloom Studio مع رابط تشاركه.</p>
  </header>

  <section class="panel" id="controls" aria-label="خيارات الوصفة">
    <div class="field"><span class="label">طريقة التقديم</span>
      <div class="seg">
        <input type="radio" name="style" id="st-hot" value="hot"><label for="st-hot">حارّة</label>
        <input type="radio" name="style" id="st-iced" value="iced" checked><label for="st-iced">مثلّجة</label>
      </div></div>
    <div class="field"><span class="label">درجة التحميص</span>
      <div class="seg">
        <input type="radio" name="roast" id="r-light" value="light"><label for="r-light">فاتح</label>
        <input type="radio" name="roast" id="r-medium" value="medium" checked><label for="r-medium">متوسط</label>
        <input type="radio" name="roast" id="r-dark" value="dark"><label for="r-dark">غامق</label>
      </div></div>
    <div class="row">
      <div class="field"><label class="label" for="dose">كمية البن: <span class="val" id="doseVal">20</span> g</label>
        <input type="range" id="dose" min="12" max="25" step="1" value="20"></div>
      <label class="check" for="flav"><input type="checkbox" id="flav"> بن منكّه (كانولي، فانيلا…)</label>
    </div>
  </section>

  <section class="panel" id="recipe" aria-live="polite"></section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <h2>وصفاتك المحفوظة</h2>
    <div class="saved">
      <a href="#holy-cannoli"><span>هولي كانولي 🧊</span><small>Bones Coffee · متوسط منكّه</small></a>
      <a href="#super-fruit"><span>سوبرر فروت 🧊 v2</span><small>فاتح إلى متوسط · فاكهي</small></a>
    </div>
  </section>
</div>

<script>
const BASE = "https://claude.ai/artifact/2gW7c5NSnKB11YwcS35Y2h";
const $ = s => document.querySelector(s);
const RN = {light:"فاتح",medium:"متوسط",dark:"غامق"};

const PRESETS = {
  "holy-cannoli": {
    name:"هولي كانولي", style:"iced", subtitle:"Bones Coffee Company · تحميص متوسط منكّه",
    dose:20, grind:59, rpm:60, ice:150, time:"2:40 – 3:00",
    pours:[[40,88,3.5,"حلزوني",35],[55,88,3.5,"حلزوني",20],[45,88,3.5,"حلزوني",15],[30,88,3.5,"حلزوني",0]],
    notes:["البطاقة الأصلية تقول تدفق 8.5، والمعتمد هنا 3.5 لأنه نطاق xBloom المعتاد.","حامضة أو خفيفة: الطحن 59 ← 57. مرّة: 59 ← 61."]
  },
  "super-fruit": {
    name:"سوبرر فروت v2", style:"iced", subtitle:"فاتح إلى متوسط · فاكهي",
    dose:20, grind:56, rpm:100, ice:110, time:"2:20 – 2:50",
    pours:[[40,93,3.0,"حلزوني",35],[40,93,3.5,"حلزوني",10],[55,93,3.5,"حلزوني",8],[55,92,3.5,"دائري",0]],
    notes:["اهتزاز بعد الـ Bloom فقط.","حامضة: الطحن 56 ← 54. مرّة: 56 ← 58. باهتة: توقف الـ Bloom 35 ← 45 s."]
  }
};

function generate(style, roast, dose, flav){
  const iced = style === "iced";
  let temp = {light:93, medium:90, dark:86}[roast] - (flav ? 2 : 0);
  let grind = {light:54, medium:57, dark:60}[roast] + (iced ? -1 : 0);
  const rpm = {light:100, medium:80, dark:60}[roast];
  const bloomPause = {light:40, medium:35, dark:30}[roast];
  const water = Math.round(dose * (iced ? 8.5 : 16) / 5) * 5;
  const ice = iced ? Math.round(dose * 16 - water) : 0;
  const bloom = dose * 2;
  const rest = water - bloom;
  const split = iced ? [0.4, 0.35] : [0.36, 0.34];
  const p2 = Math.round(rest*split[0]/5)*5, p3 = Math.round(rest*split[1]/5)*5, p4 = rest - p2 - p3;
  const pours = [
    [bloom, temp, 3.0, "حلزوني", bloomPause],
    [p2, temp, 3.5, "حلزوني", 20],
    [p3, temp, 3.5, "حلزوني", 15],
    [p4, temp - (roast === "light" ? 1 : 0), 3.5, "دائري", 0]
  ];
  const fine = grind - 2, coarse = grind + 2;
  return {
    name: (iced ? "مثلّجة" : "حارّة") + " · " + RN[roast] + (flav ? " منكّه" : ""),
    style, subtitle: "وصفة مولّدة · " + dose + " g بن",
    dose, grind, rpm, ice, time: iced ? "2:20 – 2:50" : "2:45 – 3:15", pours,
    notes: [
      "حامضة أو خفيفة: الطحن " + grind + " ← " + fine + ". مرّة أو قابضة: " + grind + " ← " + coarse + ".",
      iced ? "ضع " + ice + " g ثلج في الكوب قبل البدء، وحرّك بعد التحضير حتى يذوب." : "سخّن الكوب قبل التحضير.",
      "اهتزاز بعد الـ Bloom فقط. غيّر متغيرًا واحدًا في كل تجربة."
    ]
  };
}

function render(r, key){
  const water = r.pours.reduce((a,p)=>a+p[0],0);
  const ratio = (water / r.dose).toFixed(1);
  const total = ((water + (r.ice||0)) / r.dose).toFixed(0);
  const rows = r.pours.map((p,i)=>`<tr><td>${i===0?"Bloom":"صبة "+(i+1)}</td><td class="n">${p[0]} ml</td><td class="n">${p[1]}°</td><td class="n">${p[2].toFixed(1)}</td><td>${p[3]}</td><td class="n">${p[4]} s</td></tr>`).join("");
  $("#recipe").innerHTML = `
    <div class="card-head"><div><h2>${r.name}</h2><p class="sub">${r.subtitle}</p></div>
      <span class="tag ${r.style}">${r.style==="iced"?"مثلّجة":"حارّة"}</span></div>
    <div class="stats">
      <div class="stat"><span>البن</span><b>${r.dose} g</b></div>
      <div class="stat"><span>الماء</span><b>${water} ml</b></div>
      ${r.ice?`<div class="stat"><span>الثلج</span><b>${r.ice} g</b></div>`:""}
      <div class="stat"><span>الطحن</span><b>${r.grind}</b></div>
      <div class="stat"><span>الطاحونة</span><b>${r.rpm} RPM</b></div>
      <div class="stat"><span>النسبة</span><b>1:${ratio}${r.ice?" → 1:"+total:""}</b></div>
      <div class="stat"><span>الزمن</span><b>${r.time}</b></div>
    </div>
    <div class="tbl"><table><thead><tr><th>الصبة</th><th>الماء</th><th>الحرارة</th><th>التدفق</th><th>النمط</th><th>التوقف بعدها</th></tr></thead><tbody>${rows}</tbody></table></div>
    <ul class="notes">${r.notes.map(n=>`<li>${n}</li>`).join("")}</ul>
    <div class="actions"><button class="primary" id="copyLink" type="button">انسخ رابط الوصفة</button><button id="copyText" type="button">انسخ الوصفة كنص</button></div>
    <div class="toast" id="toast"></div>
    <textarea id="copybox" hidden readonly></textarea>`;
  const text = [r.name, r.subtitle, `البن ${r.dose} g · الطحن ${r.grind} · ${r.rpm} RPM`, `الماء ${water} ml${r.ice?` · الثلج ${r.ice} g`:""} · الزمن ${r.time}`,
    ...r.pours.map((p,i)=>`${i===0?"Bloom":"صبة "+(i+1)}: ${p[0]} ml · ${p[1]}° · تدفق ${p[2]} · ${p[3]} · توقف ${p[4]} s`), ...r.notes].join("\n");
  const link = (BASE || location.href.split("#")[0]) + "#" + key;
  $("#copyLink").onclick = () => copy(link, "نُسخ الرابط");
  $("#copyText").onclick = () => copy(text, "نُسخت الوصفة");
}

function copy(str, msg){
  const done = () => { $("#toast").textContent = msg; };
  const fallback = () => { const b=$("#copybox"); b.hidden=false; b.value=str; b.select(); $("#toast").textContent="ما قدرت أنسخ تلقائيًا. النص محدّد، انسخه يدويًا."; };
  try { navigator.clipboard.writeText(str).then(done, fallback); } catch(e){ fallback(); }
}

function current(){
  return { style: document.querySelector('input[name=style]:checked').value,
    roast: document.querySelector('input[name=roast]:checked').value,
    dose: +$("#dose").value, flav: $("#flav").checked };
}
function keyOf(c){ return `${c.style}-${c.roast}-${c.dose}${c.flav?"-flav":""}`; }
function setControls(c){
  $("#st-"+c.style).checked = true; $("#r-"+c.roast).checked = true;
  $("#dose").value = c.dose; $("#doseVal").textContent = c.dose; $("#flav").checked = c.flav;
}
function fromControls(){
  const c = current(); $("#doseVal").textContent = c.dose;
  const key = keyOf(c);
  if (location.hash !== "#"+key) history.replaceState(null, "", "#"+key);
  render(generate(c.style, c.roast, c.dose, c.flav), key);
}
function route(){
  const h = location.hash.slice(1);
  if (PRESETS[h]) { render(PRESETS[h], h); return; }
  const m = h.match(/^(hot|iced)-(light|medium|dark)-(\d{2})(-flav)?$/);
  if (m) {
    const c = {style:m[1], roast:m[2], dose:Math.min(25,Math.max(12,+m[3])), flav:!!m[4]};
    setControls(c); render(generate(c.style,c.roast,c.dose,c.flav), keyOf(c)); return;
  }
  fromControls();
}
$("#controls").addEventListener("input", fromControls);
addEventListener("hashchange", route);
route();
</script>
